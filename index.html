<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Profile Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="container">

     <h1>Github Profile Finder</h1>
     <p>Find any GitHub user's profile information.</p>

    <form id="search-form">

        <input type="text" id="username" placeholder="Enter Github profile" autocomplete="off">

        <button type="submit">Search</button>
    </form>

    <p id="message"></p>

    <div id="profile"></div>

 </div>   


<script src="script.js"></script>    
</body>
</html>
